<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Raffle">
<meta name="theme-color" content="#0e0e13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Idea Raffle</title>
<style>
:root{
  --bg:#0e0e13;--card:#18181f;--card2:#24242e;--line:#2a2a35;
  --text:#f3f3f6;--muted:#8d8d9c;--danger:#f87171;
  --s:#4ade80;--m:#60a5fa;--l:#fbbf24;--r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 160px);
  -webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
main{max-width:520px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px 16px;gap:12px}
h1{font-size:32px;margin:0;letter-spacing:-.02em;font-weight:750}
.sub{color:var(--muted);font-size:14px}
[data-size=S]{--c:var(--s)}[data-size=M]{--c:var(--m)}[data-size=L]{--c:var(--l)}

.slot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.slot.empty{background:transparent;border-style:dashed}
.slot.overdue{border-color:var(--danger)}
.tag{display:inline-flex;gap:7px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.idea{font-size:20px;font-weight:650;margin:10px 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}
.step{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.step::before{content:"→ "}
.bar{height:4px;background:var(--card2);border-radius:2px;margin:14px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:2px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.meta b{color:var(--text);font-weight:600}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:13px 10px;border-radius:12px;background:var(--card2);font-weight:600;font-size:15px;text-align:center}
.btn.primary{background:var(--c,#f3f3f6);color:#111}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.35}
.btn:active:not(:disabled){transform:scale(.98)}
.empty-msg{color:var(--muted);font-size:14px;margin:10px 0 0}
.overdue-msg{color:var(--danger);font-weight:600;font-size:14px;margin-top:12px}

.checkin{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--c)}
.dot.yes{background:var(--c)}
.dot.no{border-color:var(--card2);background:var(--card2)}
.ask{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.ask span{flex:1}
.ask .btn{flex:0 0 auto;padding:8px 14px;font-size:14px}

.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(env(safe-area-inset-bottom) + 80px);width:58px;height:58px;border-radius:50%;
  background:var(--text);color:#111;font-size:32px;font-weight:300;line-height:58px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:rgba(14,14,19,.88);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:8px 16px calc(env(safe-area-inset-bottom) + 8px);z-index:4}
.tabs button{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px}
.tabs button[aria-current=true]{color:var(--text)}
.tabs svg{width:24px;height:24px}

.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card2);color:var(--c,var(--text))}
.list-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px}
.list-item .idea{font-size:16px;margin:6px 0 2px}
.list-item .sub{font-size:13px}
.blank{text-align:center;color:var(--muted);padding:48px 16px}
.blank div{font-size:40px;margin-bottom:8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:16px}
.card p{margin:0 0 12px;color:var(--muted);font-size:14px}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.card li{margin:4px 0}
.hint{background:var(--card2);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:12px;display:flex;gap:10px;align-items:start}
.hint b{color:var(--text)}
.hint button{color:var(--muted);font-size:18px;line-height:1}

.sheet-wrap{position:fixed;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;
  padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  max-height:92dvh;overflow:auto}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet h2{margin:0 0 16px;font-size:20px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:17px;padding:13px 14px;outline:none}
.field input:focus{border-color:var(--muted)}
.sizes{display:flex;gap:8px}
.sizes button{flex:1;padding:12px 6px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:center}
.sizes button b{display:block;font-size:18px;color:var(--c)}
.sizes button small{color:var(--muted);font-size:12px}
.sizes button[aria-pressed=true]{border-color:var(--c);background:var(--card2)}

.drum{min-height:130px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;margin:6px 0 14px;
  background:var(--bg);border-radius:16px;border:1px solid var(--line);font-size:22px;font-weight:650;letter-spacing:-.01em;overflow-wrap:anywhere}
.drum.spinning{color:var(--muted)}
.drum.landed{border-color:var(--c);color:var(--text);animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.draw-step{color:var(--muted);text-align:center;margin:-4px 0 14px;font-size:14px}
.stack{display:flex;flex-direction:column;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%) translateY(10px);background:var(--text);color:#111;
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Add idea">+</button>
<nav class="tabs" aria-label="Sections">
  <button data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="4.5" rx="2"/><rect x="3" y="10" width="18" height="4.5" rx="2"/><rect x="3" y="16" width="18" height="4.5" rx="2"/></svg>Slots</button>
  <button data-view="shelf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v3M8 20h8"/></svg>Shelf</button>
  <button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</nav>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="backdrop" id="backdrop"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const KEY = 'idea-raffle-v1';
const HOUR = 36e5, DAY = 24 * HOUR, WEEK = 7 * DAY, COOL = 48 * HOUR;
const SIZES = {
  S: { name: 'Small', hint: '1 week', days: 7 },
  M: { name: 'Medium', hint: '1 month', days: 30 },
  L: { name: 'Large', hint: '3–6 months' },
};
const ORDER = ['S', 'M', 'L'];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- storage ----------
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.ideas)) return s;
  } catch (e) {}
  return { ideas: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('Could not save — storage unavailable'); }
}
let state = load();
let view = 'home';
let shelfTab = 'done';

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const now = () => Date.now();
const uid = () => now().toString(36) + Math.random().toString(36).slice(2, 7);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const fmtDate = t => new Date(t).toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtShort = t => new Date(t).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
function fmtLeft(ms) {
  if (ms >= 2 * DAY) return `${Math.floor(ms / DAY)} days left`;
  if (ms >= DAY) return `1 day ${Math.floor((ms - DAY) / HOUR)}h left`;
  if (ms >= HOUR) return `${Math.floor(ms / HOUR)}h left`;
  return `${Math.max(1, Math.floor(ms / 6e4))}m left`;
}
function fmtWait(ms) {
  const hrs = Math.ceil(ms / HOUR);
  if (hrs >= 24) return hrs % 24 ? `${Math.floor(hrs / 24)}d ${hrs % 24}h` : `${hrs / 24}d`;
  if (ms >= HOUR) return `${hrs}h`;
  return `${Math.max(1, Math.ceil(ms / 6e4))}m`;
}
function addMonths(t, m) { const d = new Date(t); d.setMonth(d.getMonth() + m); return d.getTime(); }
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400);
}

// ---------- model ----------
const active = size => state.ideas.find(i => i.status === 'active' && i.size === size);
const inPool = size => state.ideas.filter(i => i.status === 'pool' && (!size || i.size === size));
// Ideas loaded before your very first draw skip the cooling period (initial batch).
const isReady = i => i.noCool || now() - i.createdAt >= COOL;
const eligible = size => inPool(size).filter(isReady);

function activate(idea, months) {
  const t = now();
  idea.status = 'active';
  idea.drawnAt = t;
  idea.months = months || null;
  idea.deadline = months ? addMonths(t, months) : t + SIZES[idea.size].days * DAY;
  idea.duration = idea.deadline - t;
  idea.extended = false;
  idea.checkins = [];
  if (!state.firstDrawAt) state.firstDrawAt = t;
  save();
}
function toPool(idea) {
  idea.status = 'pool';
  for (const k of ['drawnAt', 'months', 'deadline', 'duration', 'extended', 'checkins', 'resolvedAt']) delete idea[k];
  save();
}
function resolve(idea, status) { idea.status = status; idea.resolvedAt = now(); save(); }

function weeksDone(a) { return Math.floor((Math.min(now(), a.deadline) - a.drawnAt) / WEEK); }
function pendingWeek(a) {
  const n = weeksDone(a);
  for (let i = 0; i < n; i++) if (a.checkins[i] == null) return i;
  return -1;
}

// ---------- views ----------
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.view === view));
  const v = $('#view');
  v.replaceChildren(view === 'home' ? homeView() : view === 'shelf' ? shelfView() : settingsView());
}

function homeView() {
  const n = inPool().length;
  const frag = document.createDocumentFragment();
  frag.append(h('header', null, h('h1', null, 'Idea Raffle'), h('span', { class: 'sub' }, n ? `${n} in the pool` : 'Pool is empty')));
  if (!isStandalone() && !state.hintDismissed) {
    frag.append(h('div', { class: 'hint' },
      h('div', { style: 'flex:1' }, h('b', null, 'Install it: '), 'tap Share → Add to Home Screen. Your ideas are stored on this device, so use the installed app.'),
      h('button', { 'aria-label': 'Dismiss', onclick: () => { state.hintDismissed = true; save(); render(); } }, '×')));
  }
  for (const s of ORDER) frag.append(slotCard(s));
  return frag;
}

function slotCard(size) {
  const a = active(size);
  const meta = SIZES[size];
  if (!a) {
    const ready = eligible(size);
    const cooling = inPool(size).filter(i => !isReady(i));
    let msg;
    if (ready.length) msg = `${ready.length} ready to draw` + (cooling.length ? ` · ${cooling.length} cooling` : '');
    else if (cooling.length) {
      const next = Math.min(...cooling.map(i => i.createdAt + COOL)) - now();
      msg = `${cooling.length} cooling · next ready in ${fmtWait(next)}`;
    } else msg = `No ${meta.name.toLowerCase()} ideas in the pool`;
    return h('section', { class: 'slot empty', 'data-size': size },
      h('div', { class: 'row' }, h('span', { class: 'tag' }, meta.name), h('span', { class: 'sub' }, meta.hint)),
      h('p', { class: 'empty-msg' }, msg),
      h('div', { class: 'actions' }, h('button', { class: 'btn primary', disabled: !ready.length, onclick: () => startDraw(size) }, 'Draw')));
  }

  const t = now();
  const overdue = t >= a.deadline;
  const card = h('section', { class: 'slot' + (overdue ? ' overdue' : ''), 'data-size': size },
    h('div', { class: 'row' }, h('span', { class: 'tag' }, meta.name), a.extended ? h('span', { class: 'sub' }, 'extended') : null),
    h('div', { class: 'idea' }, a.text),
    a.firstStep ? h('div', { class: 'step' }, a.firstStep) : null);

  if (overdue) {
    card.append(
      h('div', { class: 'overdue-msg' }, `⏰ Time's up — was due ${fmtDate(a.deadline)}`),
      h('div', { class: 'actions' },
        h('button', { class: 'btn primary', onclick: () => { resolve(a, 'done'); toast('🏆 On the shelf'); render(); } }, 'Done'),
        !a.extended ? h('button', { class: 'btn', onclick: () => extend(a) }, 'Extend once') : null),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', onclick: () => { toPool(a); toast('Back in the pool'); render(); } }, 'Back to pool'),
        h('button', { class: 'btn danger', onclick: () => { resolve(a, 'expired'); toast('🪦 Buried'); render(); } }, 'Bury')));
  } else {
    const pct = Math.min(100, ((t - a.drawnAt) / (a.deadline - a.drawnAt)) * 100);
    card.append(
      h('div', { class: 'bar' }, h('i', { style: `width:${pct.toFixed(1)}%` })),
      h('div', { class: 'meta' }, h('b', null, fmtLeft(a.deadline - t)), h('span', null, 'due ' + fmtDate(a.deadline))));
  }

  if (size === 'L') card.append(checkinBlock(a));

  if (!overdue) {
    card.append(h('div', { class: 'actions' },
      h('button', { class: 'btn danger', onclick: () => {
        if (confirm(`Drop “${a.text}”? It goes to the graveyard.`)) { resolve(a, 'dropped'); toast('🪦 Dropped'); render(); }
      } }, 'Drop'),
      h('button', { class: 'btn primary', onclick: () => {
        if (confirm(`Mark “${a.text}” as done?`)) { resolve(a, 'done'); toast('🏆 On the shelf'); render(); }
      } }, 'Done')));
  }
  return card;
}

function checkinBlock(a) {
  const n = weeksDone(a);
  const yes = a.checkins.filter(Boolean).length;
  const block = h('div', { class: 'checkin' },
    h('div', { class: 'meta' }, h('span', null, 'Weekly check-in'), h('span', null, n ? `${yes} / ${n} weeks` : 'first check-in after week 1')));
  if (n) {
    const dots = h('div', { class: 'dots' });
    for (let i = 0; i < n; i++) {
      const v = a.checkins[i];
      dots.append(h('i', { class: 'dot' + (v === true ? ' yes' : v === false ? ' no' : ''), title: `Week ${i + 1}` }));
    }
    block.append(dots);
  }
  const w = pendingWeek(a);
  if (w >= 0) {
    const answer = v => { a.checkins[w] = v; save(); render(); };
    block.append(h('div', { class: 'ask' },
      h('span', null, `Week ${w + 1}: did you show up?`),
      h('button', { class: 'btn', onclick: () => answer(false) }, 'No'),
      h('button', { class: 'btn primary', onclick: () => answer(true) }, 'Yes')));
  }
  return block;
}

function extend(a) {
  a.deadline = now() + a.duration;
  a.extended = true;
  save();
  toast(`Extended to ${fmtDate(a.deadline)} — no more extensions`);
  render();
}

function shelfView() {
  const frag = document.createDocumentFragment();
  frag.append(h('header', null, h('h1', null, 'Shelf')));
  const seg = h('div', { class: 'seg' });
  for (const [id, label] of [['done', '🏆 Trophies'], ['grave', '🪦 Graveyard']]) {
    seg.append(h('button', { 'aria-pressed': shelfTab === id, onclick: () => { shelfTab = id; render(); } }, label));
  }
  frag.append(seg);
  const items = state.ideas
    .filter(i => shelfTab === 'done' ? i.status === 'done' : i.status === 'dropped' || i.status === 'expired')
    .sort((a, b) => b.resolvedAt - a.resolvedAt);
  if (!items.length) {
    frag.append(shelfTab === 'done'
      ? h('div', { class: 'blank' }, h('div', null, '🏆'), 'Nothing finished yet. Your first trophy goes here.')
      : h('div', { class: 'blank' }, h('div', null, '🪦'), 'No graves yet. Dropping an idea is a fine outcome too.'));
    return frag;
  }
  for (const i of items) {
    const took = Math.max(1, Math.round((i.resolvedAt - i.drawnAt) / DAY));
    const line = shelfTab === 'done'
      ? `Done ${fmtShort(i.resolvedAt)} · took ${took} day${took === 1 ? '' : 's'}`
      : `${i.status === 'expired' ? 'Expired' : 'Dropped'} ${fmtShort(i.resolvedAt)} · after ${took} day${took === 1 ? '' : 's'}`;
    let extra = '';
    if (i.size === 'L' && i.checkins && i.checkins.length) extra = ` · showed up ${i.checkins.filter(Boolean).length}/${i.checkins.length} weeks`;
    frag.append(h('div', { class: 'list-item', 'data-size': i.size },
      h('span', { class: 'tag' }, SIZES[i.size].name),
      h('div', { class: 'idea' }, i.text),
      h('div', { class: 'sub' }, line + extra)));
  }
  return frag;
}

function settingsView() {
  const frag = document.createDocumentFragment();
  frag.append(h('header', null, h('h1', null, 'Settings')));
  const file = h('input', { type: 'file', accept: 'application/json,.json', hidden: true, onchange: e => importData(e.target) });
  frag.append(
    h('div', { class: 'card' },
      h('h3', null, 'Backup'),
      h('p', null, 'Your ideas live only on this phone. Deleting the app deletes them. Export a backup now and then (save it to iCloud Drive).'),
      h('div', { class: 'actions', style: 'margin-top:0' },
        h('button', { class: 'btn', onclick: exportData }, 'Export'),
        h('button', { class: 'btn', onclick: () => file.click() }, 'Import')),
      file),
    h('div', { class: 'card' },
      h('h3', null, 'Rules'),
      h('ul', null,
        h('li', null, 'One active idea per size: Small (1 week), Medium (1 month), Large (3 or 6 months).'),
        h('li', null, 'New ideas cool for 48 hours before they can be drawn — except the first batch, everything added before your first draw.'),
        h('li', null, 'The pool stays hidden. You only see the count.'),
        h('li', null, 'One re-roll per draw.'),
        h('li', null, 'Large ideas get a weekly “did you show up?” check-in.'),
        h('li', null, 'When time runs out: extend once, return to the pool, or bury it.'))),
    h('p', { class: 'sub', style: 'text-align:center' }, `${state.ideas.length} ideas total · v1`));
  return frag;
}

async function exportData() {
  const json = JSON.stringify({ app: 'idea-raffle', version: 1, exportedAt: new Date().toISOString(), ideas: state.ideas }, null, 2);
  const name = `idea-raffle-${new Date().toISOString().slice(0, 10)}.json`;
  try {
    const f = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = h('a', { href: URL.createObjectURL(new Blob([json], { type: 'application/json' })), download: name });
  document.body.append(a); a.click(); a.remove();
}

function importData(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  f.text().then(txt => {
    const data = JSON.parse(txt);
    const ideas = data && Array.isArray(data.ideas) ? data.ideas : null;
    const ok = ideas && ideas.every(i => i && typeof i.text === 'string' && SIZES[i.size] && typeof i.createdAt === 'number' &&
      ['pool', 'active', 'done', 'dropped', 'expired'].includes(i.status));
    if (!ok) throw new Error('bad file');
    if (!confirm(`Replace everything here with ${ideas.length} ideas from the backup?`)) return;
    state.ideas = ideas.map(i => ({ ...i, id: i.id || uid() }));
    save(); toast('Backup restored'); render();
  }).catch(() => toast('That file isn’t an Idea Raffle backup'));
}

// ---------- sheet ----------
let sheetLocked = false;
function openSheet(content, locked = false) {
  sheetLocked = locked;
  const wrap = $('#sheetWrap');
  $('#sheet').replaceChildren(content);
  wrap.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
}
function closeSheet() {
  const wrap = $('#sheetWrap');
  wrap.classList.remove('open');
  setTimeout(() => { wrap.hidden = true; $('#sheet').replaceChildren(); }, reduceMotion ? 0 : 280);
}
$('#backdrop').addEventListener('click', () => { if (!sheetLocked) closeSheet(); });

function openAdd() {
  let size = 'S';
  const text = h('input', { type: 'text', maxlength: 160, placeholder: 'e.g. Research communism', enterkeyhint: 'next', autocomplete: 'off' });
  const step = h('input', { type: 'text', maxlength: 160, placeholder: 'e.g. Order the Manifesto', enterkeyhint: 'done', autocomplete: 'off' });
  const sizes = h('div', { class: 'sizes' });
  const paint = () => sizes.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.size === size));
  for (const s of ORDER) {
    sizes.append(h('button', { type: 'button', 'data-size': s, onclick: () => { size = s; paint(); } },
      h('b', null, s), h('small', null, SIZES[s].hint)));
  }
  paint();
  const submit = e => {
    e.preventDefault();
    const t = text.value.trim();
    if (!t) { text.focus(); return; }
    const seed = !state.firstDrawAt;
    state.ideas.push({ id: uid(), text: t, size, firstStep: step.value.trim() || null, createdAt: now(), status: 'pool', noCool: seed || undefined });
    save(); closeSheet(); render();
    toast(seed ? 'In the pool · ready now (first batch)' : 'Dropped in the pool · drawable in 48h');
  };
  text.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); step.focus(); } });
  const form = h('form', { onsubmit: submit },
    h('h2', null, 'New idea'),
    h('label', { class: 'field' }, h('span', null, 'The idea'), text),
    h('div', { class: 'field' }, h('span', null, 'Size'), sizes),
    h('label', { class: 'field' }, h('span', null, 'First step (optional)'), step),
    h('div', { class: 'actions' },
      h('button', { type: 'button', class: 'btn', onclick: closeSheet }, 'Cancel'),
      h('button', { type: 'submit', class: 'btn primary' }, 'Add to pool')));
  openSheet(form);
  text.focus(); // synchronous, inside the tap, so iOS opens the keyboard
}

// ---------- draw ----------
function startDraw(size) {
  if (active(size) || !eligible(size).length) return;
  const drum = h('div', { class: 'drum spinning' }, '…');
  const below = h('div');
  const box = h('div', { 'data-size': size },
    h('h2', null, `Drawing a ${SIZES[size].name.toLowerCase()} idea`), drum, below);
  openSheet(box, true);
  let rerolled = false;

  const spin = exclude => {
    let pool = eligible(size);
    if (exclude && pool.length > 1) pool = pool.filter(i => i.id !== exclude.id);
    const pick = pool[Math.floor(Math.random() * pool.length)];
    activate(pick, size === 'L' ? 3 : null); // committed the moment it lands
    const names = inPool(size).map(i => i.text).concat(pick.text);
    drum.className = 'drum spinning';
    below.replaceChildren();
    roll(drum, names, pick.text, () => {
      drum.className = 'drum landed';
      reveal(pick);
    });
  };

  const reveal = pick => {
    below.replaceChildren();
    if (pick.firstStep) below.append(h('div', { class: 'draw-step' }, '→ ' + pick.firstStep));
    const stack = h('div', { class: 'stack' });
    if (size === 'L') {
      stack.append(h('div', { class: 'actions', style: 'margin-top:0' },
        h('button', { class: 'btn primary', onclick: () => accept(pick, 3) }, 'Commit 3 months'),
        h('button', { class: 'btn primary', onclick: () => accept(pick, 6) }, 'Commit 6 months')));
    } else {
      stack.append(h('button', { class: 'btn primary', onclick: () => accept(pick) }, `Let's go — due ${fmtDate(pick.deadline)}`));
    }
    const canReroll = !rerolled && eligible(size).length > 0;
    stack.append(h('button', { class: 'btn', disabled: !canReroll, onclick: () => {
      rerolled = true; toPool(pick); spin(pick);
    } }, rerolled ? 'Re-roll used' : canReroll ? 'Re-roll (1 left)' : 'Nothing else to re-roll'));
    below.append(stack);
  };

  const accept = (pick, months) => {
    if (size === 'L' && months !== pick.months) activate(pick, months);
    closeSheet(); render();
  };

  spin(null);
}

function roll(el, names, final, done) {
  if (reduceMotion) { el.textContent = final; done(); return; }
  if (names.length < 2) { setTimeout(() => { el.textContent = final; done(); }, 700); return; }
  let delay = 45;
  const tick = () => {
    if (delay > 280) { el.textContent = final; done(); return; }
    let n;
    do { n = names[Math.floor(Math.random() * names.length)]; } while (n === el.textContent);
    el.textContent = n;
    delay *= 1.14;
    setTimeout(tick, delay);
  };
  tick();
}

// ---------- boot ----------
function isStandalone() { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; }
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { view = b.dataset.view; render(); scrollTo(0, 0); }));
$('#fab').addEventListener('click', openAdd);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
setInterval(() => { if ($('#sheetWrap').hidden) render(); }, 60e3);
render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
